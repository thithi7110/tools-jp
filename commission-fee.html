<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>依頼料金の手取り計算 | クリエイターの計算ツール</title><meta name="description" content="依頼料金から販売サイトの手数料・振込手数料を引いた手取り額と、手取りから逆算した料金を計算します。"><link rel="stylesheet" href="style.css"></head>
<body><header><a href="./">クリエイターの計算ツール</a></header><main><h1>依頼料金の手取り計算</h1><div class="card"><label>依頼料金（円）</label><input id="p" type="number" value="10000"><label>販売サイトの手数料（%）</label><input id="r" type="number" value="0" step="0.1"><label>1件あたりの固定手数料・振込手数料（円）</label><input id="f" type="number" value="0"><div class="out" id="o1"></div></div>
<div class="card"><label>手取りで受け取りたい金額（円）</label><input id="w" type="number" value="10000"><div class="out" id="o2"></div></div>
<p>手数料率は利用するサービスの最新の規約でご確認のうえ入力してください。サービスによっては依頼者側が手数料を払う場合もあります。</p><div class="card shop"><span class="tag">作者のショップ</span>このサイトの作者が作った<a href="https://kurashitools.booth.pm/" rel="noopener">イラスト依頼管理表・同人イベント管理シート・クリエイター向け帳簿</a>などのExcelテンプレートをBOOTHで販売しています（無料の家計簿・カレンダーもあります）。</div></main>
<footer><a href="./">ツール一覧</a> ・ <a href="privacy.html">プライバシーポリシー・免責事項</a><br>入力内容はお使いのブラウザ内だけで計算され、送信・保存されません。</footer><script>function f(){const p=+document.getElementById("p").value,r=+document.getElementById("r").value/100,x=+document.getElementById("f").value,w=+document.getElementById("w").value;const fm=n=>Math.round(n).toLocaleString("ja-JP");
const fee=Math.ceil(p*r);document.getElementById("o1").textContent="手数料 "+fm(fee+x)+" 円 → 手取り "+fm(p-fee-x)+" 円";
const need=r<1?Math.ceil((w+x)/(1-r)):0;document.getElementById("o2").textContent="必要な依頼料金は 約 "+fm(need)+" 円";}
document.querySelectorAll("input").forEach(i=>i.addEventListener("input",f));f();</script></body></html>
