<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>消費税計算（10%・8%） | くらしの計算ツール</title><meta name="description" content="税込・税抜の金額を10%と8%（軽減税率）で計算します。"><link rel="stylesheet" href="style.css"></head>
<body><header><a href="./">くらしの計算ツール</a></header><main><h1>消費税計算（10%・8%）</h1><div class="card"><label>金額（円）</label><input id="v" type="number" value="1000"><label>入力した金額は</label><select id="k"><option value="ex">税抜</option><option value="in">税込</option></select><label>端数処理</label><select id="r"><option value="floor">切り捨て</option><option value="round">四捨五入</option><option value="ceil">切り上げ</option></select>
<table style="margin-top:1rem"><tr><th>税率</th><th>税抜</th><th>消費税</th><th>税込</th></tr><tbody id="o"></tbody></table></div>
<p>実際の請求額は、お店や事業者の端数処理の方法によって数円異なる場合があります。</p><div class="card shop"><span class="tag">作者のショップ</span>このサイトの作者が作った<a href="https://kurashitools.booth.pm/" rel="noopener">家計簿・ふるさと納税管理シート・2027年カレンダー</a>をBOOTHで配布・販売しています（カレンダーは無料）。</div></main>
<footer><a href="./">ツール一覧</a> ・ <a href="privacy.html">プライバシーポリシー・免責事項</a><br>入力内容はお使いのブラウザ内だけで計算され、送信・保存されません。</footer><script>function f(){const v=+document.getElementById("v").value,k=document.getElementById("k").value,R=Math[document.getElementById("r").value];const fm=x=>x.toLocaleString("ja-JP");
document.getElementById("o").innerHTML=[10,8].map(p=>{let ex,inc;if(k==="ex"){ex=v;inc=v+R(v*p/100)}else{inc=v;ex=inc-R(inc*p/(100+p))}return `<tr><td>${p}%</td><td>${fm(ex)}</td><td>${fm(inc-ex)}</td><td>${fm(inc)}</td></tr>`}).join("")}
document.querySelectorAll("input,select").forEach(i=>i.addEventListener("input",f));f();</script></body></html>
