<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>和暦・西暦 変換 | くらしの計算ツール</title><meta name="description" content="西暦と和暦（令和・平成・昭和・大正・明治）を相互に変換します。"><link rel="stylesheet" href="style.css"></head>
<body><header><a href="./">くらしの計算ツール</a></header><main><h1>和暦・西暦 変換</h1><div class="card"><label>西暦（年）</label><input id="y" type="number" value="2027"><div class="out" id="o1"></div></div>
<div class="card"><label>和暦</label><select id="e"></select><label>年</label><input id="n" type="number" value="9"><div class="out" id="o2"></div></div>
<div class="card"><h2 style="font-size:1.1rem">元号の始まり</h2><p>令和: 2019年5月1日 / 平成: 1989年1月8日 / 昭和: 1926年12月25日 / 大正: 1912年7月30日 / 明治: 1868年10月23日</p><p>改元のあった年は、日付によって元号が変わります（例: 2019年4月30日までは平成31年）。</p></div><div class="card shop"><span class="tag">作者のショップ</span>このサイトの作者が作った<a href="https://kurashitools.booth.pm/" rel="noopener">家計簿・ふるさと納税管理シート・2027年カレンダー</a>をBOOTHで配布・販売しています（カレンダーは無料）。</div></main>
<footer><a href="./">ツール一覧</a> ・ <a href="privacy.html">プライバシーポリシー・免責事項</a><br>入力内容はお使いのブラウザ内だけで計算され、送信・保存されません。</footer><script>const ERAS=[["令和",2019,5,1],["平成",1989,1,8],["昭和",1926,12,25],["大正",1912,7,30],["明治",1868,10,23]];
const e=document.getElementById("e");ERAS.forEach(a=>e.add(new Option(a[0],a[0])));
function f1(){const y=+document.getElementById("y").value;const r=ERAS.filter(a=>y>=a[1]&&y<=(ERAS[ERAS.indexOf(a)-1]?.[1]??9999)).map(a=>a[0]+(y-a[1]+1===1?"元":y-a[1]+1)+"年");document.getElementById("o1").textContent=r.length?y+"年 は "+r.join(" / "):"明治以降の年を入力してください";}
function f2(){const a=ERAS.find(x=>x[0]===e.value),n=+document.getElementById("n").value;document.getElementById("o2").textContent=n>0?e.value+n+"年 は 西暦"+(a[1]+n-1)+"年":"";}
["y","n","e"].forEach(i=>document.getElementById(i).addEventListener("input",()=>{f1();f2()}));f1();f2();</script></body></html>
