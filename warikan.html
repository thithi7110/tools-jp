<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>割り勘計算 | クリエイターの計算ツール</title><meta name="description" content="合計金額と人数から1人あたりの金額を計算します。端数の扱いも選べます。"><link rel="stylesheet" href="style.css"></head>
<body><header><a href="./">クリエイターの計算ツール</a></header><main><h1>割り勘計算</h1><div class="card"><label>合計金額（円）</label><input id="t" type="number" value="10000"><label>人数</label><input id="p" type="number" value="3" min="1"><label>集める単位</label><select id="u"><option>1</option><option>10</option><option selected>100</option><option>500</option><option>1000</option></select><div class="out" id="o"></div></div><div class="card shop"><span class="tag">作者のショップ</span>このサイトの作者が作った<a href="https://kurashitools.booth.pm/" rel="noopener">イラスト依頼管理表・同人イベント管理シート・クリエイター向け帳簿</a>などのExcelテンプレートをBOOTHで販売しています（無料の家計簿・カレンダーもあります）。</div></main>
<footer><a href="./">ツール一覧</a> ・ <a href="privacy.html">プライバシーポリシー・免責事項</a><br>入力内容はお使いのブラウザ内だけで計算され、送信・保存されません。</footer><script>function f(){const t=+document.getElementById("t").value,p=Math.max(1,+document.getElementById("p").value|0),u=+document.getElementById("u").value;const each=Math.ceil(t/p/u)*u,low=Math.floor(t/p/u)*u;
const nHigh=u?Math.max(0,Math.ceil((t-low*p)/(each-low||1))):0;let s="1人 "+each.toLocaleString()+" 円ずつ集めると "+(each*p-t).toLocaleString()+" 円余ります。";
if(each!==low&&nHigh<p)s+="<br>または "+nHigh+"人が "+each.toLocaleString()+" 円、"+(p-nHigh)+"人が "+low.toLocaleString()+" 円（合計 "+(nHigh*each+(p-nHigh)*low).toLocaleString()+" 円）";document.getElementById("o").innerHTML=s}
document.querySelectorAll("input,select").forEach(i=>i.addEventListener("input",f));f();</script></body></html>
